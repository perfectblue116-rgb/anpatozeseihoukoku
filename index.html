<title>安全パトロール 是正報告書</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#111;--line:#222;--bar:#1f3a4d;--accent:#e8a317;--bg:#d9dde0}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;background:var(--bg);font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;color:var(--ink)}
#bar{max-width:100vw;overflow:visible;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:6px 10px;background:linear-gradient(180deg,#fff 0%,#e8f3fd 100%);border-bottom:1px solid #c6def4;box-shadow:0 2px 8px rgba(30,110,170,.15);color:#12324d}
#bar .top{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0;max-width:460px}
#bar .site-pick{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 8px;border:1.5px solid #8ec5f0;border-radius:10px;background:#fff}
#bar .lb{flex:none;font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:#ffb020;color:#3b2600}
#bar #siteSel{flex:1;min-width:0;height:34px;padding:0;border:0;background:transparent;color:#12324d;font:inherit;font-size:14px;font-weight:700;text-overflow:ellipsis;cursor:pointer;max-width:none}
#bar #siteSel:focus{outline:none}
#bar .site-pick:focus-within{border-color:#1e88e5}
#bar .st{flex:0 1 auto;display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.3;color:#4b6275;white-space:nowrap}
#bar .st::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#19c26b;box-shadow:0 0 0 3px rgba(25,194,107,.2)}
#bar .st:empty{display:none}
#bar .acts{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto;position:relative}
#bar .a{flex:0 0 auto;min-height:38px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;border:1.5px solid #d3dde7;border-radius:10px;background:#fff;color:#0b5fa5;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
#bar .a svg{flex:none;width:16px;height:16px}
#bar .a:active{transform:scale(.97)}
#bar .a.add{background:#fff3d6;border-color:#ffd37a;color:#8a5200}
#bar .a.pdf{background:#e3f1fd;border-color:#a9d3f5}
#bar .a.line{background:linear-gradient(180deg,#1fd873,#06c755);border-color:transparent;color:#fff;box-shadow:0 2px 6px rgba(6,199,85,.35)}
#bar .a.ic{width:38px;padding:0;color:#55697e}
#bar .a.ic svg{width:18px;height:18px}
#menu{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;gap:6px;min-width:210px;padding:8px;background:#fff;border:1px solid #c6def4;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30}
#menu.open{display:flex}
#menu button{min-height:40px;padding:0 12px;border:1.5px solid #d3dde7;border-radius:8px;background:#fff;color:#12324d;font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
#menu button.danger{color:#b3261e;border-color:#f0c4c0}
#menu hr{margin:2px 0;border:0;border-top:1px solid #e1e8ef}
@media (max-width:560px){
#bar{padding:6px 8px;gap:6px}
#bar .top{flex:1 1 100%;max-width:none}
#bar .acts{flex:1 1 100%;margin-left:0;flex-wrap:wrap;gap:6px}
#bar .a{min-width:0;min-height:40px}
#bar .a:not(.ic){flex:1 1 auto;padding:0 6px;font-size:12.5px}
#bar .a:not(.ic) svg{display:none}
#bar .a.ic{flex:0 0 40px;width:40px}
#bar .st{font-size:10px}
#menu{right:0;left:auto;max-width:calc(100vw - 16px)}}
#stage{transform-origin:top left;width:210mm;margin:10px auto}
.sheet{position:relative;width:210mm;height:297mm;margin:0 auto 12px;padding:7mm 6mm;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:10pt}
.ver{position:absolute;top:4mm;right:6mm;font-size:6.5pt;font-weight:700}
.head{height:19mm;position:relative}
.head.slim{height:8mm}
.title{position:absolute;left:1mm;top:5mm;font-size:16pt}
.site{position:absolute;left:1mm;bottom:1mm;display:flex;align-items:flex-end;width:110mm;font-size:11pt}
.site input{flex:1;border:0;border-bottom:1px solid var(--line);font:inherit;padding:0 2px;margin-left:4mm;background:transparent;border-radius:0}
.meta{position:absolute;right:1mm;bottom:1mm;font-size:11pt;line-height:6.5mm}
.meta div{display:flex;gap:4mm;align-items:center}
.meta input{border:0;font:inherit;width:34mm;background:transparent;padding:0}
.frame{border:1px solid var(--line);height:calc(100% - 19mm)}
.slim+.frame{height:calc(100% - 8mm)}
.cap{height:5.5mm;line-height:5.5mm;text-align:center;letter-spacing:6mm;font-size:10.5pt;border-bottom:1px solid var(--line)}
.blk{height:84mm;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.hd{display:flex;align-items:center;height:6mm;border-bottom:1px dotted #000;font-size:10.5pt;padding-left:1mm;gap:2mm}
.hd .no{display:inline-block;min-width:5mm;text-align:center}
select{font:inherit;font-size:9.5pt;height:5mm;padding:0 1mm;border:1px solid #888;border-radius:3px;background:#fff;max-width:62mm}
.detail{display:block;width:100%;height:11mm;border:0;border-bottom:1px dotted #000;resize:none;padding:0 1mm;font:inherit;font-size:10pt;line-height:5.5mm;background:transparent;border-radius:0}
.pics{flex:1;display:flex;min-height:0}
.col{width:95mm;display:flex;flex-direction:column}
.col.r{width:auto;flex:1}
.gap{width:7mm}
.lb2{height:5.5mm;line-height:5.5mm;padding-left:1mm;font-size:10.5pt;border-bottom:1px solid var(--line)}
.photo{flex:1;position:relative;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.col:first-child .photo{border-left:0}
.photo img{display:block;width:100%;height:100%;object-fit:fill;border:0}
.col.r .photo{border-left:1px solid var(--line)}
.photo .wrap{position:relative;display:block;width:100%;height:100%;line-height:0}
.photo .ph{color:#9aa;font-size:10pt}
.photo .x{position:absolute;top:2mm;right:2mm;width:7mm;height:7mm;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.del{position:absolute;right:2mm;bottom:1.5mm;font-size:8pt;border:1px solid #c33;color:#c33;background:#fff;border-radius:4px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:50;max-width:90vw}
dialog{border:0;border-radius:10px;padding:16px;width:min(92vw,420px)}
dialog label{display:block;margin:10px 0 2px;font-size:13px;font-weight:700}
dialog input{width:100%;padding:8px;border:1px solid #999;border-radius:6px;font-size:14px}
dialog p{font-size:12px;color:#555;line-height:1.5}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog button{padding:8px 14px;border-radius:6px;border:1px solid #999;background:#fff}
</style>
</head>
<body>
<div id="bar">
  <div class="top">
    <label class="site-pick"><span class="lb">現場</span><select id="siteSel" aria-label="保存済みの現場・月を選択"></select></label>
    <span class="st" id="st" role="status"></span>
  </div>
  <div class="acts">
    <button id="add" class="a add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>シート追加</button>
    <button id="pdf" class="a pdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M6 14h12v7H6z"/></svg>PDF出力</button>
    <button id="lw" class="a line" type="button">LINE WORKS投稿</button>
    <button id="more" class="a ic" type="button" aria-label="その他の操作" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    <button id="cfg" class="a ic" type="button" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    <div id="menu" role="menu">
      <button id="renew" type="button">当月分作成</button>
      <button id="renewSite" type="button">新しい現場で作成</button>
      <hr>
      <button id="siteDel" class="danger" type="button">この月の保存を削除</button>
    </div>
  </div>
</div>
<div id="stage"></div>
<div id="toast"></div>
<dialog id="dlg">
  <b>LINE WORKS 投稿設定</b>
  <p>LINE WORKSのAPI認証情報はブラウザに置けないため、中継サーバー(Google Apps Script等)のURLを指定します。PDFと概要テキストをそのURLへPOSTします。</p>
  <label>中継URL</label><input id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label>合言葉(任意・中継側と同じ値)</label><input id="cfgSecret">
  <div class="btns"><button id="cfgCancel">閉じる</button><button id="cfgSave">保存</button></div>
</dialog>
<script>
// ▼ 指摘内容の段階プルダウン(大分類 → 小分類)。ここを編集して項目を変更
const ITEMS = {
  "書類関係":["作業計画書・KY活動表の不備","安全書類の未整備・期限切れ","施工体制台帳・掲示物の不備","資格証・免許証の携帯不足","新規入場者教育の記録不備"],
  "墜落・転落防止":["開口部の養生不足","手すり・親綱の未設置","安全帯(フルハーネス)未使用","脚立・足場板の不適切使用","屋根・高所作業の対策不足"],
  "足場・仮設":["足場の点検不備","昇降設備の不備","朝顔・養生シートの不備","仮設電気・配線の不備","通路・歩廊の確保不足"],
  "電気・火気":["電動工具の漏電対策不備","コードの被覆損傷・タコ足","火気の管理不足(消火器未設置)","溶接・溶断の火花養生不足","分電盤の施錠・表示不備"],
  "重機・車両":["誘導員未配置","作業半径内への立入","車両の駐車・動線不備","吊り荷下の立入","KY・点検記録の不備"],
  "整理整頓・清掃":["資材の乱雑な置き場","通路上の障害物","廃材・ゴミの放置","釘・ビス等の踏み抜き危険","喫煙・休憩所の管理不備"],
  "保護具・服装":["ヘルメット未着用・顎紐未使用","保護メガネ・防じんマスク未着用","安全靴・手袋の不適切","服装・反射材の不備"],
  "粉じん・騒音・環境":["散水・飛散防止不足","騒音・振動対策不足","産廃分別・保管の不備","近隣・第三者への配慮不足"],
  "その他":["その他(詳細に記入)"]
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage');
const todayStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const photoHTML=l=>`<div class="col ${l==='後'?'r':''}"><div class="lb2">是正${l}</div><div class="photo"><span class="ph">タップして写真を追加</span></div></div>`;
const blockHTML=()=>`<div class="blk"><div class="hd"><span>指摘内容</span><b class="no"></b>
<select class="cat"></select><select class="sub"></select></div>
<textarea class="detail" placeholder="詳細内容を入力"></textarea>
<div class="pics">${photoHTML('前')}<div class="gap"></div>${photoHTML('後')}</div></div>`;
function addSheet(){
  const first=!$('.sheet');
  const el=document.createElement('section');el.className='sheet';
  el.innerHTML=`<div class="ver">工事課様式 エステート住宅産業㈱ Ver-AI-1</div>`+
  (first?`<div class="head"><div class="title">安全パトロール 是正報告書</div>
  <div class="site">現場名<input id="site"></div>
  <div class="meta"><div>報告者<input id="who" style="border-bottom:1px solid #222"></div><div>報告日<input id="day" type="date" value="${todayStr()}"></div></div></div>`
  :`<div class="head slim"></div>`)+
  `<div class="frame"><div class="cap">指 摘 事 項</div>${blockHTML()+blockHTML()+blockHTML()}</div>
  ${first?'':'<button class="del">このシートを削除</button>'}`;
  stage.appendChild(el);
  el.querySelectorAll('.cat').forEach(s=>{s.innerHTML='<option value="">大分類を選択</option>'+Object.keys(ITEMS).map(k=>`<option>${k}</option>`).join('');});
  el.querySelectorAll('.sub').forEach(s=>s.innerHTML='<option value="">小分類を選択</option>');
  renumber();return el;
}
function renumber(){$$('.no').forEach((n,i)=>n.textContent=i+1)}
stage.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('cat')){
    const sub=t.parentElement.querySelector('.sub');
    sub.innerHTML='<option value="">小分類を選択</option>'+(ITEMS[t.value]||[]).map(v=>`<option>${v}</option>`).join('');
  }
});
stage.addEventListener('click',e=>{
  const t=e.target;
  if(t.tagName==='INPUT')return;
  if(t.classList.contains('x')){e.stopPropagation();resetCol(t.closest('.photo'));return}
  if(t.classList.contains('del')){
    if(t.dataset.armed){t.parentElement.remove();renumber();return}
    t.dataset.armed=1;t.textContent='もう一度タップで削除';t.style.background='#c33';t.style.color='#fff';
    setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='このシートを削除';t.style.background='#fff';t.style.color='#c33'}},3500);return}
  const p=t.closest('.photo');
  if(p&&(!p.querySelector('img')||e.target.tagName==='IMG'))pickPhotos(p);
});
// ▼ 写真選択: 複数選択可。選んだ順に、タップした枠から空き枠へ自動で貼り付け(足りなければシートを自動追加)
function pickPhotos(p){
  const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;f.hidden=true;p.appendChild(f);
  f.onchange=()=>{const files=[...f.files];f.remove();if(files.length)fillPhotos(files,p)};
  f.click();
}
function fillPhotos(files,box){
  let boxes=$$('.photo'),idx=boxes.indexOf(box);
  files.forEach((file,n)=>{
    let target=box;
    if(n>0){
      do{idx++;if(idx>=boxes.length){addSheet();boxes=$$('.photo')}}while(boxes[idx].querySelector('img'));
      target=boxes[idx];
    }
    loadPhoto(file,target);
  });
  if(files.length>1)toast(files.length+'枚を貼り付けました');
}
const PH='<span class="ph">タップして写真を追加</span>';
function resetCol(box){
  box.innerHTML=PH;
}
function setPhoto(box,src){box.innerHTML=`<span class="wrap"><img src="${src}"><button class="x noprint">×</button></span>`}
function loadPhoto(file,box){
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
    const M=1600,r=Math.min(1,M/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    resetCol(box);
    setPhoto(box,c.toDataURL('image/jpeg',0.85));
    URL.revokeObjectURL(url);
  };im.src=url;
}
function fit(){stage.style.zoom=Math.min(1,(innerWidth-12)/(210*3.7795))}
addEventListener('resize',fit);
function toast(m,ms=2500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);if(ms)toast.h=setTimeout(()=>t.style.display='none',ms)}
const fmtDay=()=>($('#day').value||'').replace(/-/g,'/');
// ▼ PDF生成(各シートをA4ページ化)
async function buildPdf(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const z=stage.style.zoom;stage.style.zoom=1;
  const sheets=$$('.sheet');
  try{
    for(let i=0;i<sheets.length;i++){
      toast(`PDF作成中… ${i+1}/${sheets.length}`,0);
      const cv=await html2canvas(sheets[i],{scale:2,backgroundColor:'#fff',useCORS:true,onclone:d=>{
        d.querySelectorAll('.noprint,.del,.ph').forEach(e=>e.remove());
        d.querySelectorAll('select').forEach(s=>{const sp=d.createElement('span');sp.textContent=s.value?s.value:'';sp.style.cssText='font-size:9.5pt';s.replaceWith(sp)});
        d.querySelectorAll('input[type=date]').forEach(s=>{const sp=d.createElement('span');sp.textContent=fmtDay();s.replaceWith(sp)});
        d.querySelectorAll('textarea').forEach(t=>{const dv=d.createElement('div');dv.className='detail';dv.style.whiteSpace='pre-wrap';dv.style.overflow='hidden';dv.textContent=t.value;t.replaceWith(dv)});
      }});
      if(i)doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg',0.88),'JPEG',0,0,210,297);
    }
  }finally{stage.style.zoom=z}
  toast('',1);$('#toast').style.display='none';return doc;
}
const fname=()=>`安全パトロール是正報告書_${($('#site').value||'現場名未入力').trim()}_${($('#day').value||'').replace(/-/g,'')}.pdf`;
function libsOk(){if(window.html2canvas&&window.jspdf)return true;toast('PDF用ライブラリを読み込めません。ネット接続を確認し、HTMLファイルをブラウザで直接開いてください',7000);return false}
$('#pdf').onclick=async()=>{
  if(!libsOk())return;
  try{
    const doc=await buildPdf(),name=fname();
    const url=URL.createObjectURL(doc.output('blob'));
    const a=document.createElement('a');a.href=url;a.download=name;a.target='_blank';
    document.body.appendChild(a);a.click();a.remove();
    const t=$('#toast');t.innerHTML='PDFを作成しました。自動で保存されない場合は <a href="'+url+'" download="'+name+'" target="_blank" style="color:#ffd34d">ここをタップ</a>';
    t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',15000);
  }catch(e){$('#toast').style.display='none';toast('PDF出力に失敗: '+(e&&e.message||e),8000)}
};
// ▼ LINE WORKS投稿(中継サーバー経由)
const cfgGet=()=>{try{return JSON.parse(localStorage.getItem('sp_lw')||'{}')}catch(e){return{}}};
function openCfg(){const c=cfgGet();$('#cfgUrl').value=c.url||'';$('#cfgSecret').value=c.secret||'';$('#dlg').showModal()}
$('#cfg').onclick=openCfg;$('#cfgCancel').onclick=()=>$('#dlg').close();
$('#cfgSave').onclick=()=>{try{localStorage.setItem('sp_lw',JSON.stringify({url:$('#cfgUrl').value.trim(),secret:$('#cfgSecret').value}))}catch(e){}$('#dlg').close();toast('設定を保存しました')};
$('#lw').onclick=async()=>{
  const c=cfgGet();if(!c.url){openCfg();return}
  const b=$('#lw');
  if(!b.dataset.armed){b.dataset.armed=1;b.textContent='もう一度押すと投稿';setTimeout(()=>{delete b.dataset.armed;b.textContent='LINE WORKS投稿'},4000);return}
  delete b.dataset.armed;b.textContent='LINE WORKS投稿';
  if(!libsOk())return;
  try{
    const doc=await buildPdf();
    const text='是正報告書を提出いたします。';
    const b64=doc.output('datauristring').split(',')[1];
    toast('LINE WORKSへ送信中…',0);
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.secret||'',filename:fname(),text,pdfBase64:b64})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok!==false)toast('LINE WORKSに投稿しました');else toast('投稿失敗: '+(j.error||r.status),6000);
  }catch(e){toast('投稿失敗: '+e.message,6000)}
};
// ▼ 新規作成(確認のため2回タップ)。keep=true: 現場名・報告者を残す
function resetReport(keep){
  const site=$('#site').value, who=$('#who').value;
  stage.innerHTML='';
  addSheet();
  if(keep){$('#site').value=site;$('#who').value=who;curKey=null;warnedName='';try{localStorage.removeItem('sp_last')}catch(e){}refreshSel()}
  else{curKey=null;warnedName='';try{localStorage.removeItem('sp_last')}catch(e){}refreshSel()}
  scrollTo({top:0,behavior:'smooth'});
}
function armBtn(id,label,armedLabel,fn){
  const b=$(id);
  b.onclick=()=>{
    if(!b.dataset.armed){
      b.dataset.armed=1;b.textContent=armedLabel;b.style.background='#c33';b.style.color='#fff';
      b.h=setTimeout(()=>{delete b.dataset.armed;b.textContent=label;b.style.background='';b.style.color=''},4000);return;
    }
    clearTimeout(b.h);delete b.dataset.armed;b.textContent=label;b.style.background='';b.style.color='';
    fn();
  };
}
armBtn('#renew','当月分作成','もう一度押すと消去',async()=>{await saveNow();resetReport(true);toast('当月分の報告書を作成しました(前の月の保存は残っています)')});
armBtn('#renewSite','新しい現場で作成','もう一度押すと全消去',async()=>{await saveNow();resetReport(false);toast('新しい現場用に白紙にしました(元の現場は保存済み)')});
$('#add').onclick=()=>{const s=addSheet();s.scrollIntoView({behavior:'smooth',block:'start'})};
addSheet();fit();
// ▼ 「その他」メニュー(開閉・実行後に閉じる)
const menu=$('#menu'),more=$('#more');
const setMenu=o=>{menu.classList.toggle('open',o);more.setAttribute('aria-expanded',o)};
more.onclick=e=>{e.stopPropagation();setMenu(!menu.classList.contains('open'))};
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTimeout(()=>{if(!b.dataset.armed)setMenu(false)},0)});
document.addEventListener('click',e=>{if(!menu.contains(e.target))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
// ▼ 現場ごとの登録保存・切り替え(この端末のブラウザ内 IndexedDB に保存)
let curKey=null,restoring=false,saveT=0,warnedName='',dbp=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('sp_reports',1);r.onupgradeneeded=()=>r.result.createObjectStore('r');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('r',mode),q=fn(t.objectStore('r'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbGet=k=>tx('readonly',s=>s.get(k)),dbPut=(k,v)=>tx('readwrite',s=>s.put(v,k)),dbDel=k=>tx('readwrite',s=>s.delete(k)),dbAll=()=>tx('readonly',s=>s.getAll());
function collect(){
  return{site:$('#site').value,who:$('#who').value,day:$('#day').value,
    sheets:$$('.sheet').map(sh=>({blocks:[...sh.querySelectorAll('.blk')].map(b=>({
      cat:b.querySelector('.cat').value,sub:b.querySelector('.sub').value,detail:b.querySelector('.detail').value,
      imgs:[...b.querySelectorAll('.photo')].map(p=>{const i=p.querySelector('img');return i?i.src:''})}))}))};
}
const hasContent=()=>$$('.blk').some(b=>b.querySelector('.cat').value||b.querySelector('.detail').value.trim()||b.querySelector('.photo img'));
function applyState(st){
  restoring=true;
  stage.innerHTML='';
  const n=Math.max(1,(st.sheets||[]).length);
  for(let i=0;i<n;i++)addSheet();
  $('#site').value=st.site||'';$('#who').value=st.who||'';$('#day').value=st.day||todayStr();
  $$('.sheet').forEach((sh,i)=>{
    const bl=(st.sheets[i]&&st.sheets[i].blocks)||[];
    [...sh.querySelectorAll('.blk')].forEach((b,j)=>{
      const d=bl[j];if(!d)return;
      const cat=b.querySelector('.cat');cat.value=d.cat||'';
      cat.dispatchEvent(new Event('change',{bubbles:true}));
      b.querySelector('.sub').value=d.sub||'';
      b.querySelector('.detail').value=d.detail||'';
      b.querySelectorAll('.photo').forEach((p,k)=>{if(d.imgs&&d.imgs[k])setPhoto(p,d.imgs[k])});
    });
  });
  restoring=false;
  scrollTo({top:0});
}
const monthOf=d=>(d||todayStr()).slice(0,7);
const keyOf=(site,day)=>site.trim()+'|'+monthOf(day);
const monthLabel=m=>{const a=m.split('-');return a[0]+'年'+Number(a[1])+'月'};
async function refreshSel(){
  let list=[];try{list=await dbAll()}catch(e){}
  const g={};list.forEach(r=>{(g[r.name]=g[r.name]||[]).push(r)});
  const names=Object.keys(g).sort((a,b)=>Math.max(...g[b].map(r=>r.updated))-Math.max(...g[a].map(r=>r.updated)));
  const sel=$('#siteSel');
  sel.innerHTML='<option value="">'+(list.length?'保存済みから選択('+list.length+'件)':'現場名を入力すると自動保存')+'</option>'+names.map(n=>
    '<optgroup label="'+esc(n)+'">'+g[n].sort((a,b)=>b.month<a.month?-1:1).map(r=>`<option value="${esc(r.key)}">${esc(r.name)}　${monthLabel(r.month)}</option>`).join('')+'</optgroup>').join('');
  sel.value=curKey||'';
}
async function saveNow(){
  clearTimeout(saveT);
  if(restoring)return;
  const site=$('#site').value.trim();
  if(!site)return;
  const day=$('#day').value||todayStr(),key=keyOf(site,day);
  try{
    if(key!==curKey&&await dbGet(key)){
      if(warnedName!==key){warnedName=key;toast('同じ現場・同じ月の報告書が保存済みのため、この入力は保存されません。報告日の月を変えるか、上のリストから開いてください',7000)}
      return;
    }
    const st=collect();st.name=site;st.month=monthOf(day);st.key=key;st.updated=Date.now();
    await dbPut(key,st);
    if(curKey&&curKey!==key)await dbDel(curKey);
    curKey=key;try{localStorage.setItem('sp_last',key)}catch(e){}
    const d=new Date(),p=n=>String(n).padStart(2,'0');$('#st').textContent='自動保存 '+p(d.getHours())+':'+p(d.getMinutes());
    refreshSel();
  }catch(e){toast('この端末では保存できません: '+(e&&e.message||e),6000)}
}
const scheduleSave=()=>{if(restoring)return;clearTimeout(saveT);saveT=setTimeout(saveNow,800)};
new MutationObserver(scheduleSave).observe(stage,{childList:true,subtree:true});
stage.addEventListener('input',scheduleSave);stage.addEventListener('change',scheduleSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
addEventListener('pagehide',saveNow);
$('#siteSel').onchange=async()=>{
  const v=$('#siteSel').value;
  if(!v||v===curKey){$('#siteSel').value=curKey||'';return}
  if(!$('#site').value.trim()&&hasContent()){
    if(!confirm('現場名が未入力のため、いまの入力内容は保存されていません。切り替えると失われます。切り替えますか?')){$('#siteSel').value=curKey||'';return}
  }else await saveNow();
  try{
    const st=await dbGet(v);
    if(!st){toast('保存データが見つかりません');refreshSel();return}
    applyState(st);curKey=v;try{localStorage.setItem('sp_last',v)}catch(e){}
    refreshSel();toast('「'+st.name+' '+monthLabel(st.month)+'」を開きました');
  }catch(e){toast('読み込みに失敗: '+(e&&e.message||e),6000)}
};
armBtn('#siteDel','この月の保存を削除','もう一度押すと削除',async()=>{
  if(!curKey){toast('削除する保存済みの報告書が選ばれていません');return}
  const k=curKey;let st=null;
  try{st=await dbGet(k);await dbDel(k);resetReport(false);toast('「'+(st?st.name+' '+monthLabel(st.month):k)+'」の保存を削除しました')}catch(e){toast('削除に失敗: '+(e&&e.message||e),6000)}
});
// 旧形式(現場名のみのキー)の保存データを「現場名|年月」へ移行
async function migrate(){
  let all=[];try{all=await dbAll()}catch(e){return}
  const last=(()=>{try{return localStorage.getItem('sp_last')}catch(e){return null}})();
  for(const r of all){
    if(r.key)continue;
    const old=r.name||r.site||'';if(!old)continue;
    const m=monthOf(r.day||new Date(r.updated||Date.now()).toISOString().slice(0,10));
    const key=old.trim()+'|'+m;
    r.name=old.trim();r.month=m;r.key=key;
    if(!(await dbGet(key)))await dbPut(key,r);
    await dbDel(old);
    if(last===old){try{localStorage.setItem('sp_last',key)}catch(e){}}
  }
}
